# Home Box edge — sole published listener (compose maps host 8123 → this).
# Upstream apps stay on the Docker network only.
# Use Docker DNS (127.0.0.11) + variables so recreate IP changes are picked up.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8123;
    server_name _;
    client_max_body_size 32m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Enroll UI (QR / owner bootstrap)
    location = /enroll {
        return 302 /enroll/;
    }
    location /enroll/ {
        set $enroll_upstream enroll-ui:8099;
        proxy_pass http://$enroll_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /enroll;
        proxy_read_timeout 120s;
    }

    # Tuya Local CSV / Excel import
    location = /import {
        return 302 /import/;
    }
    location /import/ {
        set $import_upstream tuya-import:8098;
        proxy_pass http://$import_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /import;
        proxy_read_timeout 120s;
    }

    # OpenClaw MCP (SSE)
    location = /mcp {
        return 302 /mcp/;
    }
    location /mcp/ {
        set $mcp_upstream home-box-mcp:8100;
        proxy_pass http://$mcp_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /mcp;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Home Box UI + API + WebSocket (everything else)
    location / {
        set $ha_upstream homeassistant:8123;
        proxy_pass http://$ha_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
