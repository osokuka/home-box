services:
  homeassistant:
    container_name: home-box-core
    build:
      context: ./image
      dockerfile: Dockerfile
    image: home-box:local
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ./config:/config
      - ./image/configuration.yaml:/config/configuration.yaml:ro
      - ./image/packages:/config/packages:ro
      - ./image/www:/config/www:ro
      - ./image/themes:/config/themes:ro
      # Product: Tuya Local from image (not Core cloud tuya).
      - ./image/custom_components:/config/custom_components:ro
    # No host ports — only gateway publishes :8123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ha

  # Sole host entrypoint: path-routes to HA / enroll / import / MCP.
  gateway:
    image: nginx:1.27-alpine
    container_name: home-box-gateway
    restart: unless-stopped
    ports:
      - "${HOME_BOX_HTTP_PORT:-8123}:8123"
    volumes:
      - ./nginx/home-box.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - homeassistant
      - enroll-ui
      - tuya-import
      - home-box-mcp
    networks:
      - ha

  platform-agent:
    build:
      context: ./platform
      dockerfile: Dockerfile.enroll
    image: home-box-enroll:local
    container_name: home-box-agent
    restart: unless-stopped
    working_dir: /app
    hostname: platform-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_PLATFORM_URL: ${BMS_PLATFORM_URL:-}
      BMS_ENROLL_TOKEN: ${BMS_ENROLL_TOKEN:-}
      BMS_APPLIANCE_UID: ${BMS_APPLIANCE_UID:-}
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      BMS_HA_TOKEN: ${BMS_HA_TOKEN:-}
      BMS_INTERVAL: ${BMS_INTERVAL:-5}
      BMS_HEARTBEAT_EVERY: ${BMS_HEARTBEAT_EVERY:-4}
      BMS_CLIMATE_ENTITY: ${BMS_CLIMATE_ENTITY:-climate.heat_pump}
      HA_CONFIG: /config
      HOME_BOX_WG_CONTAINER: home-box-wireguard
      BMS_AGENT_VERSION: ${BMS_AGENT_VERSION:-home-box-feed-0.1}
    volumes:
      - ./platform/agent.py:/app/agent.py:ro
      - ./platform/sensor_feed.py:/app/sensor_feed.py:ro
      - ./platform/ha_token.py:/app/ha_token.py:ro
      - ./platform/enroll_store.py:/app/enroll_store.py:ro
      - ./platform/wg_store.py:/app/wg_store.py:ro
      - ./platform/bms_fetch.py:/app/bms_fetch.py:ro
      - ./platform/bms_runtime.py:/app/bms_runtime.py:ro
      - ./platform/bms_share.py:/app/bms_share.py:ro
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-u", "/app/agent.py"]
    depends_on:
      - homeassistant
    networks:
      - ha

  enroll-ui:
    build:
      context: ./platform
      dockerfile: Dockerfile.enroll
    image: home-box-enroll:local
    container_name: home-box-enroll
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_PLATFORM_URL: ${BMS_PLATFORM_URL:-}
      BMS_ENROLL_UI_PORT: "8099"
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      HA_CONFIG: /config
      HOME_BOX_ROOT: /workspace
      HOME_BOX_WG_SERVICE: wireguard
      HOME_BOX_WG_CONTAINER: home-box-wireguard
      # Lab/tech only. Default off — enrolled boxes cannot be cleared via the UI/API.
      ENROLL_ALLOW_RESET: ${ENROLL_ALLOW_RESET:-0}
      HOME_BOX_OPEN_URL: ${HOME_BOX_OPEN_URL:-http://127.0.0.1:8123}
      PUBLIC_BASE_PATH: /enroll
    # No host ports — use http://<box>:8123/enroll/
    volumes:
      - ./platform/enroll_ui.py:/app/enroll_ui.py:ro
      - ./platform/enroll_store.py:/app/enroll_store.py:ro
      - ./platform/wg_store.py:/app/wg_store.py:ro
      - ./platform/bms_fetch.py:/app/bms_fetch.py:ro
      - ./platform/bms_runtime.py:/app/bms_runtime.py:ro
      - ./platform/static:/app/static:ro
      - ./config:/config
      - ./:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-u", "/app/enroll_ui.py"]
    networks:
      - ha

  # WireGuard client — part of the default stack (Linux / Pi with kernel WG).
  # Conf is written from enroll QR to config/wireguard/wg0.conf
  # Windows Docker Desktop: tunnel may be unreliable; import wg0.conf into WireGuard for Windows if needed.
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20210914-r4-ls50
    container_name: home-box-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      PUID: "0"
      PGID: "0"
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules:ro
    # Client mode dials out to the hub — no host UDP publish.
    networks:
      - ha

  # Publish Home Box UI on the WireGuard address (10.10.x.y:8123) for CF/NPM edge.
  # Shares the WG container netns; forwards to homeassistant on the compose network.
  wg-ha-proxy:
    image: alpine/socat:1.8.0.0
    container_name: home-box-wg-ha-proxy
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
      - homeassistant
    command:
      [
        "TCP-LISTEN:8123,fork,reuseaddr,bind=0.0.0.0",
        "TCP:homeassistant:8123",
      ]

  tuya-import:
    build:
      context: ./platform
      dockerfile: Dockerfile.tuya-import
    image: home-box-tuya-import:local
    container_name: home-box-tuya-import
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_TUYA_IMPORT_PORT: "8098"
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      BMS_HA_TOKEN: ${BMS_HA_TOKEN:-}
      HA_CONFIG: /config
      PUBLIC_BASE_PATH: /import
    # No host ports — use http://<box>:8123/import/
    volumes:
      - ./platform/tuya_import_ui.py:/app/tuya_import_ui.py:ro
      - ./platform/tuya_csv.py:/app/tuya_csv.py:ro
      - ./config:/config
    command: ["python", "-u", "/app/tuya_import_ui.py"]
    depends_on:
      - homeassistant
    networks:
      - ha

  # MCP for OpenClaw — live discovery + deny-listed device control
  home-box-mcp:
    build:
      context: ./platform
      dockerfile: Dockerfile.mcp
    image: home-box-mcp:local
    container_name: home-box-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      BMS_HA_TOKEN: ${BMS_HA_TOKEN:-}
      # Optional hint only — MCP tools do not require a default climate entity
      BMS_CLIMATE_ENTITY: ${BMS_CLIMATE_ENTITY:-}
      BMS_MCP_HOST: "0.0.0.0"
      BMS_MCP_PORT: "8100"
      # Set to 0 for status-only (no call_service / turn_*)
      HOME_BOX_MCP_ALLOW_CONTROL: ${HOME_BOX_MCP_ALLOW_CONTROL:-1}
      HA_CONFIG: /config
    # No host ports — use http://<box>:8123/mcp/sse
    volumes:
      - ./platform/mcp_server.py:/app/mcp_server.py:ro
      - ./platform/ha_readonly.py:/app/ha_readonly.py:ro
      - ./platform/ha_control.py:/app/ha_control.py:ro
      - ./config:/config:ro
    command: ["python", "-u", "/app/mcp_server.py"]
    depends_on:
      - homeassistant
    networks:
      - ha

  lan-router:
    image: python:3.12-alpine
    container_name: home-box-lan-router
    restart: unless-stopped
    network_mode: "service:homeassistant"
    cap_add:
      - NET_ADMIN
    environment:
      ENABLE_LAN_SOCKS: ${ENABLE_LAN_SOCKS:-1}
    volumes:
      - ./tuya/transparent-socks.py:/app/transparent-socks.py:ro
      - ./network/protect-egress.sh:/app/protect-egress.sh:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache iptables ip6tables >/dev/null
        sh /app/protect-egress.sh
        if [ "$${ENABLE_LAN_SOCKS:-1}" = "1" ]; then
          exec python /app/transparent-socks.py
        fi
        sleep infinity

networks:
  ha:
    name: ha
