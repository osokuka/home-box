services:
  homeassistant:
    container_name: home-box-core
    build:
      context: ./image
      dockerfile: Dockerfile
    image: home-box:local
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ./config:/config
      - ./image/configuration.yaml:/config/configuration.yaml:ro
      - ./image/packages:/config/packages:ro
      - ./image/www:/config/www:ro
      - ./image/themes:/config/themes:ro
      # Product: Tuya Local from image (not Core cloud tuya).
      - ./image/custom_components:/config/custom_components:ro
    # HTTP published for lab. WireGuard remote access is later.
    ports:
      - "8123:8123"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ha

  platform-agent:
    image: python:3.12-alpine
    container_name: home-box-agent
    restart: unless-stopped
    working_dir: /app
    hostname: platform-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_PLATFORM_URL: ${BMS_PLATFORM_URL:-http://host.docker.internal:8080}
      BMS_ENROLL_TOKEN: ${BMS_ENROLL_TOKEN:-}
      BMS_APPLIANCE_UID: ${BMS_APPLIANCE_UID:-}
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      BMS_HA_TOKEN: ${BMS_HA_TOKEN:-}
      BMS_INTERVAL: ${BMS_INTERVAL:-20}
      BMS_CLIMATE_ENTITY: ${BMS_CLIMATE_ENTITY:-climate.heat_pump}
      HA_CONFIG: /config
    volumes:
      - ./platform/agent.py:/app/agent.py:ro
      - ./platform/enroll_store.py:/app/enroll_store.py:ro
      - ./config:/config:ro
    command: ["python", "-u", "/app/agent.py"]
    depends_on:
      - homeassistant
    networks:
      - ha

  enroll-ui:
    image: python:3.12-alpine
    container_name: home-box-enroll
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_PLATFORM_URL: ${BMS_PLATFORM_URL:-http://host.docker.internal:8080}
      BMS_ENROLL_UI_PORT: "8099"
      HA_CONFIG: /config
    ports:
      - "8099:8099"
    volumes:
      - ./platform/enroll_ui.py:/app/enroll_ui.py:ro
      - ./platform/enroll_store.py:/app/enroll_store.py:ro
      - ./platform/static:/app/static:ro
      - ./config:/config
    command: ["python", "-u", "/app/enroll_ui.py"]
    networks:
      - ha

  tuya-import:
    build:
      context: ./platform
      dockerfile: Dockerfile.tuya-import
    image: home-box-tuya-import:local
    container_name: home-box-tuya-import
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_TUYA_IMPORT_PORT: "8098"
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      BMS_HA_TOKEN: ${BMS_HA_TOKEN:-}
      HA_CONFIG: /config
    ports:
      - "8098:8098"
    volumes:
      - ./platform/tuya_import_ui.py:/app/tuya_import_ui.py:ro
      - ./platform/tuya_csv.py:/app/tuya_csv.py:ro
      - ./config:/config
    command: ["python", "-u", "/app/tuya_import_ui.py"]
    depends_on:
      - homeassistant
    networks:
      - ha

  # Read-only MCP for OpenClaw / AI agents (no device commands)
  home-box-mcp:
    build:
      context: ./platform
      dockerfile: Dockerfile.mcp
    image: home-box-mcp:local
    container_name: home-box-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BMS_HA_URL: ${BMS_HA_URL:-http://homeassistant:8123}
      BMS_HA_TOKEN: ${BMS_HA_TOKEN:-}
      BMS_CLIMATE_ENTITY: ${BMS_CLIMATE_ENTITY:-climate.heat_pump}
      BMS_MCP_HOST: "0.0.0.0"
      BMS_MCP_PORT: "8100"
      HA_CONFIG: /config
    ports:
      - "8100:8100"
    volumes:
      - ./platform/mcp_server.py:/app/mcp_server.py:ro
      - ./platform/ha_readonly.py:/app/ha_readonly.py:ro
      - ./config:/config:ro
    command: ["python", "-u", "/app/mcp_server.py"]
    depends_on:
      - homeassistant
    networks:
      - ha

  lan-router:
    image: python:3.12-alpine
    container_name: home-box-lan-router
    restart: unless-stopped
    network_mode: "service:homeassistant"
    cap_add:
      - NET_ADMIN
    environment:
      ENABLE_LAN_SOCKS: ${ENABLE_LAN_SOCKS:-1}
    volumes:
      - ./tuya/transparent-socks.py:/app/transparent-socks.py:ro
      - ./network/protect-egress.sh:/app/protect-egress.sh:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache iptables ip6tables >/dev/null
        sh /app/protect-egress.sh
        if [ "$${ENABLE_LAN_SOCKS:-1}" = "1" ]; then
          exec python /app/transparent-socks.py
        fi
        sleep infinity

networks:
  ha:
    name: ha
